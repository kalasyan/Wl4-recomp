plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.wl4.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // One APK: the USA and European releases are the same cartridge.
        applicationId 'dev.wl4.android'
        minSdk 24
        targetSdk 35
        // CI sets these for each build of main (see .github/workflows/build.yml):
        // the release tag without its "v", and the run number, so that every
        // release installs over the one before it.
        versionCode Integer.parseInt(System.getenv('WL4_VERSION_CODE') ?: '1')
        versionName System.getenv('WL4_VERSION_NAME') ?: '0.1.0'
        resValue 'string', 'app_name', 'Wario Land 4'

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk {
            // The AYN Thor and every current phone are 64-bit ARM; x86_64 is
            // for the emulator.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1+'
        }
    }

    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Signed with the release keystore when CI provides one (see
            // .github/workflows/build.yml), otherwise with the debug key.
            signingConfig System.getenv('ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Extracted to disk: libgame.so is loaded by the launcher at a
            // reserved address (android_dlopen_ext).
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}
