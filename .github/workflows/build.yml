name: build

# Every push to main that builds publishes a release, v0.1.<run number>, with
# the APK, so app stores that follow GitHub releases (Obtainium) see each
# update. Pushing a v* tag (or running the workflow by hand with a release tag)
# creates that release instead, a pre-release if the tag has a suffix such as
# v1.0-beta.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create from this commit and attach the APK to (e.g. v1.0); empty to only build
        required: false
        default: ''
  # Publishing a release from the GitHub page also attaches the APK to it.
  release:
    types: [published]

jobs:
  linux:
    name: Linux (headless smoke test and SDL frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        # SDL3's headers for X11, Wayland, audio and gamepads (it loads the
        # libraries themselves at run time).
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev \
            libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev libusb-1.0-0-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Smoke test (no game data)
        # The game can't run without the player's ROM, so CI only checks that
        # the port starts and refuses a file that isn't Wario Land 4.
        run: |
          head -c 8388608 /dev/zero > zero.gba
          if ./build/wl4_headless zero.gba --frames 10 > out.txt 2>&1; then
            cat out.txt; echo "a zero-filled ROM was accepted"; exit 1
          fi
          cat out.txt
          grep -q "Unsupported ROM" out.txt
      - name: Rumble test
        run: ./build/wl4-rumble-event-test

  arm64:
    name: AArch64 load/store emulation (qemu)
    # Android runs the game on AArch64, where the I/O page traps are emulated
    # instruction by instruction (port/src/os_linux_arm64.c).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
      - name: Build
        run: |
          cmake -B build -G Ninja --toolchain port/cmake/linux-aarch64-cross.cmake -DWL4_FRONTEND=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target wl4_headless
      - name: Test
        run: |
          qemu-aarch64-static -L /usr/aarch64-linux-gnu build/wl4_headless --test-arm64
          # With SVE the signal frame holds the vector registers in another record.
          qemu-aarch64-static -L /usr/aarch64-linux-gnu -cpu max,sve=on build/wl4_headless --test-arm64

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          name=${TAG#v}
          [ -n "$name" ] || name=0.1.${{ github.run_number }}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "WL4_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "WL4_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "version $name (${{ github.run_number }})"
      - name: Set up the release keystore
        id: keystore
        # Optional: without these secrets the APK is signed with the runner's
        # throwaway debug key, and no release is published from main.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = release ] || [ "${{ github.ref_type }}" = tag ] || [ -n "${{ inputs.release }}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release APK is signed with a debug key"
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log
      - name: Show the signing certificate
        # Release APKs must keep the same certificate so updates install
        # over older versions.
        run: |
          # APK signature scheme v2 only (minSdk 24): keytool can't read it.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -E "DN:|SHA-256"
          done
      - name: Report build errors
        if: failure()
        working-directory: android
        # Surface the end of the log as an annotation (readable from the API).
        run: |
          {
            grep -nE "error|Error|FAILED|What went wrong" gradle.log | tail -40
            echo "----- tail -----"
            tail -60 gradle.log
          } > summary.txt || true
          msg=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build log::${msg}"
      - uses: actions/upload-artifact@v6
        with:
          name: wl4-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish the release
    # Only the APK built above, never game data. From main only when the APK is
    # signed with the release key: Android refuses updates signed with another.
    if: >-
      github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release != '' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true')
    needs: [linux, arm64, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # A release made on the page with a new tag can also fire the tag push.
    concurrency: release-${{ needs.android.outputs.version }}
    steps:
      # Only for the release notes in docs/release-notes/<tag>.md, if there are any.
      - uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release || format('v{0}', needs.android.outputs.version) }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          notes="src/docs/release-notes/$TAG.md"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $pre
          fi
          if [ -f "$notes" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi
          mkdir dist
          cp "$(find artifacts -name '*.apk' | head -1)" "dist/Wario_Land_4-$VERSION.apk"
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
