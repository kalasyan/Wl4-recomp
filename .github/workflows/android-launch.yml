name: android-launch

# Installs the APK on an Android emulator and checks that it starts and keeps
# running (without a ROM it waits on the ROM picker).

on:
  push:
    branches: [main]
    paths: ['android/**', 'port/**', 'CMakeLists.txt', '.github/workflows/android-launch.yml', '.github/scripts/android-launch.sh']
  workflow_dispatch:

jobs:
  launch:
    name: Android emulator launch test
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        # The SDK, the NDK build and the emulator image don't fit in the runner's free space.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Inspect native libraries
        run: |
          ndk=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin
          for abi in arm64-v8a x86_64; do
            for lib in $(find android/app/build/intermediates -path "*release*/$abi/*.so" | grep -E "lib(game|main)\.so" | sort -u); do
              echo "=== $lib"
              ls -l "$lib"
              $ndk/llvm-readelf -l -d "$lib" | grep -E "LOAD|TEXTREL|NEEDED|FLAGS|GNU_RELRO" || true
            done
          done
      - name: Remove the native build files
        run: rm -rf android/app/.cxx android/app/build/intermediates && df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-launch.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-launch-logcat
          path: logcat.txt
          if-no-files-found: ignore
